{% extends "learning_hub/base.html" %}

{% block title %}Delete Document | Django Lab 4{% endblock title %}

{% block content %}
  <section class="card">
    <h2>Delete Document</h2>
    <p>Are you sure you want to delete <strong>{{ document.label }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit">Confirm Delete</button>
      <a href="{% url 'learning_hub:document_list' %}">Cancel</a>
    </form>
  </section>
{% endblock content %}
