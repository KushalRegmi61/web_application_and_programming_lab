{% extends "learning_hub/base.html" %}

{% block title %}Delete Course | Django Lab 4{% endblock title %}

{% block content %}
  <section class="card">
    <h2>Delete Course</h2>
    <p>Are you sure you want to delete <strong>{{ course }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit">Confirm Delete</button>
      <a href="{% url 'learning_hub:course_list' %}">Cancel</a>
    </form>
  </section>
{% endblock content %}
