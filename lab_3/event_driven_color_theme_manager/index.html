<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 10 - Event-Driven Color & Theme Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card" aria-labelledby="theme-title">
        <h1 id="theme-title">Event-Driven Color &amp; Theme Manager</h1>
        <p class="subtitle">
          Choose colors to update the page theme in real time.
        </p>

        <div class="theme-controls">
          <div class="field-group">
            <label for="bg-color">Background Color</label>
            <input id="bg-color" type="color" value="#f4f7fb" />
          </div>

          <div class="field-group">
            <label for="text-color">Text Color</label>
            <input id="text-color" type="color" value="#1d2433" />
          </div>

          <div class="field-group">
            <label for="button-color">Button Color</label>
            <input id="button-color" type="color" value="#0b7a75" />
          </div>

          <button id="reset-btn" type="button" class="secondary">
            Reset Theme
          </button>
        </div>

        <section class="preview" aria-labelledby="preview-title">
          <h2 id="preview-title">Theme Preview</h2>
          <p>
            This preview updates instantly whenever you select a new color from
            the controls above.
          </p>
          <button id="preview-btn" type="button">Sample Button</button>
        </section>

        <section class="theme-object" aria-labelledby="object-title">
          <h2 id="object-title">Selected Theme Object</h2>
          <pre id="theme-output" aria-live="polite"></pre>
        </section>
      </section>
    </main>

    <script src="index.js"></script>
  </body>
</html>
